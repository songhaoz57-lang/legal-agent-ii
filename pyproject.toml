[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-agent"
version = "0.1.0"
description = "A legal assistant agent with local source retrieval and safety guardrails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.3.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "numpy>=2.0",
  "openai>=2.36",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
legal-agent = "legal_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
