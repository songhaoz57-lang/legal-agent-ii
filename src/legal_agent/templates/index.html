<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ii - 合同审查系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a2e;line-height:1.6;min-height:100vh}
header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
header .brand span{width:30px;height:30px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
header .dot{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.6)}
header .dot i{width:6px;height:6px;border-radius:50%;background:#10b981;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 380px;gap:20px}
.left,.right{display:flex;flex-direction:column;gap:16px}
.right{position:sticky;top:80px;align-self:start}
.card{background:#fff;border:1px solid #e4e6ea;border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:#374151}
.drop-zone{border:2px dashed #d1d5db;border-radius:10px;padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfc}
.drop-zone:hover,.drop-zone.drag{border-color:#4f46e5;background:#eef2ff}
.drop-zone .dz-icon{font-size:32px;margin-bottom:10px;display:block}
.drop-zone .dz-title{font-size:13px;color:#374151;font-weight:500}
.drop-zone .dz-hint{font-size:11px;color:#9ca3af;margin-top:4px}
input[type=file]{display:none}
.status-msg{margin-top:12px;font-size:13px;padding:10px 14px;border-radius:8px;display:none}
.status-msg.show{display:block}
.status-msg.loading{background:#eef2ff;color:#4f46e5}
.status-msg.ok{background:#ecfdf5;color:#059669}
.status-msg.err{background:#fef2f2;color:#ef4444}
.score-row{display:flex;align-items:center;gap:16px;padding:16px;border-radius:10px;margin-bottom:16px}
.score-row.danger{background:#fef2f2;border:1px solid #fecaca}
.score-row.warn{background:#fffbeb;border:1px solid #fde68a}
.score-row.good{background:#ecfdf5;border:1px solid #a7f3d0}
.score-circle{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0;border:4px solid}
.score-row.danger .score-circle{border-color:#ef4444;color:#ef4444}
.score-row.warn .score-circle{border-color:#f59e0b;color:#d97706}
.score-row.good .score-circle{border-color:#10b981;color:#059669}
.score-info h3{font-size:14px;margin-bottom:2px}
.score-info p{font-size:11px;color:#6b7280}
.risk-bar{display:flex;gap:6px;margin-bottom:16px}
.risk-bar button{flex:1;padding:10px 6px;border:1px solid #e4e6ea;border-radius:8px;font-size:11px;font-weight:600;background:#fff;cursor:pointer;transition:all .15s;text-align:center}
.risk-bar button .n{font-size:22px;display:block;line-height:1.1;margin-bottom:2px}
.risk-bar button.active{box-shadow:0 0 0 2px #4f46e5;border-color:#4f46e5}
.risk-bar button.bar-high{color:#ef4444}.risk-bar button.bar-high.active{background:#fef2f2;border-color:#ef4444;box-shadow:0 0 0 2px #ef4444}
.risk-bar button.bar-mid{color:#d97706}.risk-bar button.bar-mid.active{background:#fffbeb;border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b}
.risk-bar button.bar-low{color:#3b82f6}.risk-bar button.bar-low.active{background:#eff6ff;border-color:#3b82f6;box-shadow:0 0 0 2px #3b82f6}
.risk-list{display:flex;flex-direction:column;gap:8px}
.risk-item{border:1px solid #e4e6ea;border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s}
.risk-item:hover{box-shadow:0 2px 4px rgba(0,0,0,.06)}
.risk-item .rhead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.risk-item .rdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.risk-item .rtitle{font-size:13px;font-weight:600;flex:1}
.risk-item .rarrow{font-size:10px;color:#9ca3af;transition:transform .2s}
.risk-item.open .rarrow{transform:rotate(180deg)}
.risk-item .rbody{display:none;padding:0 14px 14px;font-size:12px}
.risk-item.open .rbody{display:block}
.risk-item .rbody .rquote{font-family:"SF Mono",Consolas,monospace;font-size:11px;background:#f3f4f6;padding:6px 10px;border-radius:6px;margin-bottom:8px;color:#6b7280;word-break:break-all}
.risk-item .rbody .rsug{color:#374151;line-height:1.6}
.risk-item.lv-high{border-left:4px solid #ef4444;background:#fef2f2}.risk-item.lv-high .rdot{background:#ef4444}
.risk-item.lv-mid{border-left:4px solid #f59e0b;background:#fffbeb}.risk-item.lv-mid .rdot{background:#f59e0b}
.risk-item.lv-low{border-left:4px solid #3b82f6;background:#eff6ff}.risk-item.lv-low .rdot{background:#3b82f6}
.missing-row{display:flex;flex-wrap:wrap;gap:6px}
.missing-tag{font-size:11px;padding:5px 12px;border-radius:16px;background:#f3f4f6;color:#6b7280;border:1px solid #e4e6ea}
.tabs{display:flex;border-bottom:1px solid #e4e6ea;margin-bottom:14px}
.tab-btn{padding:7px 18px;font-size:12px;font-weight:500;border:none;background:none;color:#9ca3af;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab-btn.active{color:#4f46e5;border-bottom-color:#4f46e5}
.tab-panel{display:none}
.tab-panel.active{display:block}
.chat-box{max-height:360px;overflow-y:auto;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.chat-box::-webkit-scrollbar{width:4px}
.chat-box::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
.chat-msg{font-size:12px;padding:10px 12px;border-radius:10px;max-width:88%;line-height:1.6;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.you{align-self:flex-end;background:#4f46e5;color:#fff;border-bottom-right-radius:4px}
.chat-msg.bot{align-self:flex-start;background:#f3f4f6;border:1px solid #e4e6ea;border-bottom-left-radius:4px}
.chat-msg .who{font-size:10px;opacity:.5;margin-bottom:2px;font-weight:600}
.chat-row{display:flex;gap:8px}
.chat-row input{flex:1;padding:10px 14px;border:1px solid #e4e6ea;border-radius:10px;font-size:12px;outline:none;background:#f9fafb;transition:border-color .15s}
.chat-row input:focus{border-color:#4f46e5;background:#fff}
.chat-row button{padding:10px 18px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.chat-row button:hover{background:#3730a3}
.src-search{margin-bottom:10px}
.src-search input{width:100%;padding:8px 12px;border:1px solid #e4e6ea;border-radius:8px;font-size:11px;outline:none;background:#f9fafb}
.src-search input:focus{border-color:#4f46e5}
.src-list{font-size:11px;max-height:240px;overflow-y:auto}
.src-item{padding:6px 8px;cursor:pointer;border-radius:6px;margin-bottom:1px;transition:all .15s}
.src-item:hover{background:#eef2ff;color:#4f46e5}
.empty{text-align:center;padding:32px 16px;color:#9ca3af;font-size:12px}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.1);border-top-color:#4f46e5;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:12px;width:90%;max-width:700px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e4e6ea}
.modal-head h3{font-size:14px;font-weight:600}
.modal-close{width:32px;height:32px;border:none;background:none;font-size:18px;cursor:pointer;color:#9ca3af;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#f3f4f6;color:#374151}
.modal-body{padding:20px;overflow-y:auto;flex:1;font-size:13px;line-height:1.8;white-space:pre-wrap;color:#374151}
@media(max-width:860px){main{grid-template-columns:1fr}.right{position:static}}

/* ── paywall ── */
.pay-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,30,.88);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.pay-overlay.hidden{display:none}
.pay-card{background:#fff;border-radius:16px;width:90%;max-width:420px;padding:36px 28px 28px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.3);animation:modalIn .3s ease}
.pay-icon{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
.pay-card h2{font-size:18px;font-weight:700;margin-bottom:6px;color:#1a1a2e}
.pay-card .pay-desc{font-size:12px;color:#6b7280;margin-bottom:20px;line-height:1.6}
.pay-price{font-size:36px;font-weight:800;color:#1a1a2e;margin-bottom:4px}
.pay-price span{font-size:14px;font-weight:400;color:#9ca3af}
.pay-features{text-align:left;margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
.pay-features .pf{display:flex;align-items:center;gap:8px;font-size:12px;color:#374151}
.pay-features .pf .chk{color:#10b981;font-weight:700;font-size:14px}
.pay-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.pay-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.4)}
.pay-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.pay-footer{font-size:10px;color:#9ca3af;margin-top:14px}
.pay-footer a{color:#4f46e5;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class=brand><span>&#9878;</span>&#12304;ii&#12305; 合同审查系统</div>
  <div class=dot><i></i>飞书机器人 &middot; 已连接</div>
</header>
<main>
<div class=left>
  <div class=card id=uploadCard>
    <h2>&#128196; 上传合同文件</h2>
    <div class=drop-zone id=dropZone>
      <span class=dz-icon>&#128228;</span>
      <p class=dz-title>拖拽文件到此处或点击上传</p>
      <p class=dz-hint>支持 .txt .md .docx &middot; 大小不限</p>
    </div>
    <input type=file id=fileInput accept=".txt,.md,.docx">
    <div class=status-msg id=statusMsg></div>
  </div>
  <div class="card hidden" id=resultCard>
    <h2>&#128269; 审查结果</h2>
    <div class=score-row id=scoreRow></div>
    <div class=risk-bar id=riskBar></div>
    <div class=tabs>
      <button class="tab-btn active" data-panel=risks>风险条款</button>
      <button class=tab-btn data-panel=missing>缺失条款</button>
    </div>
    <div class="tab-panel active" id=panelRisks><div class=risk-list id=riskList></div></div>
    <div class=tab-panel id=panelMissing><div class=missing-row id=missingRow></div></div>
  </div>
</div>
<div class=right>
  <div class=card>
    <h2>&#128172; &#12304;ii&#12305; 法律咨询</h2>
    <div class=chat-box id=chatBox>
      <div class="chat-msg bot"><div class=who>&#12304;ii&#12305;</div>你好！我是飞书机器人 ii。上传合同我帮你审查风险，也可以直接提问法律问题。</div>
    </div>
    <div class=chat-row>
      <input type=text id=chatInput placeholder="输入法律问题，按 Enter 发送...">
      <button id=chatSend>发送</button>
    </div>
  </div>
  <div class=card>
    <h2>&#128218; 法律知识库</h2>
    <div class=src-search><input type=text id=srcSearch placeholder="搜索法律条目..."></div>
    <div class=src-list id=srcList><div class=empty>加载中...</div></div>
  </div>
</div>
</main>
<div class=modal-overlay id=modalOverlay onclick="if(event.target===this)closeModal()">
  <div class=modal-box>
    <div class=modal-head><h3 id=modalTitle></h3><button class=modal-close onclick=closeModal()>&times;</button></div>
    <div class=modal-body id=modalBody></div>
  </div>
</div>
<script>

// ── payment ──
var po=document.getElementById("payOverlay"),pb=document.getElementById("payBtn"),paidSession=localStorage.getItem("ii_paid_session");

async function checkAccess(){
  if(!paidSession) return false;
  try{var r=await fetch("/api/payment/check/"+encodeURIComponent(paidSession));var d=await r.json();return d.paid}catch(e){return false}
}
async function initPaywall(){
  var paid=await checkAccess();
  if(paid){ po.classList.add("hidden"); return }
  // check URL for session_id return from Stripe
  var sp=new URLSearchParams(location.search);
  var sid=sp.get("session_id");
  if(sid){
    pb.textContent="验证支付中..."; pb.disabled=true;
    try{
      var r=await fetch("/api/payment/verify/"+encodeURIComponent(sid),{method:"POST"});
      var d=await r.json();
      if(d.paid){ localStorage.setItem("ii_paid_session",sid); paidSession=sid; po.classList.add("hidden"); history.replaceState({},"",location.pathname); return }
    }catch(e){}
    pb.textContent="&#128179; 立即订阅"; pb.disabled=false;
  }
}
async function startPayment(){
  pb.textContent="正在连接..."; pb.disabled=true;
  try{
    var r=await fetch("/api/payment/create-checkout",{method:"POST"});
    var d=await r.json();
    if(d.url) location.href=d.url;
    else alert("支付服务暂不可用");
  }catch(e){ alert("支付服务暂不可用: "+e.message) }
  pb.textContent="&#128179; 立即订阅"; pb.disabled=false;
}
initPaywall();

// ── state ──
var dz=document.getElementById("dropZone"),
    fi=document.getElementById("fileInput"),
    sm=document.getElementById("statusMsg"),
    uc=document.getElementById("uploadCard"),
    rc=document.getElementById("resultCard"),
    sr=document.getElementById("scoreRow"),
    rb=document.getElementById("riskBar"),
    rl=document.getElementById("riskList"),
    mr=document.getElementById("missingRow"),
    cb=document.getElementById("chatBox"),
    ci=document.getElementById("chatInput"),
    cs=document.getElementById("chatSend"),
    sl=document.getElementById("srcList"),
    ss=document.getElementById("srcSearch"),
    mo=document.getElementById("modalOverlay"),
    mt=document.getElementById("modalTitle"),
    mb=document.getElementById("modalBody"),
    risks=[], sources=[], activeFilter="all";

// ── upload ──
dz.onclick=function(){ fi.click() };
fi.onchange=function(){ if(fi.files.length) review(fi.files[0]) };
dz.ondragover=function(e){ e.preventDefault(); dz.classList.add("drag") };
dz.ondragleave=function(){ dz.classList.remove("drag") };
dz.ondrop=function(e){ e.preventDefault(); dz.classList.remove("drag");
  var f=e.dataTransfer.files[0]; if(f) review(f) };

function status(msg,cls){
  sm.textContent=msg; sm.className="status-msg show "+(cls||"loading");
}
function hideStatus(){ sm.className="status-msg" }

async function review(file){
  status("正在审查合同...", "loading");
  var fd=new FormData(); fd.append("file",file);
  try{
    var r=await fetch("/api/review",{method:"POST",body:fd});
    if(!r.ok) throw new Error(r.status);
    var d=await r.json();
    show(d);
    status("审查完成", "ok");
    setTimeout(hideStatus,3000);
  }catch(e){
    status("审查失败: "+e.message, "err");
  }
}

function show(d){
  risks=d.risks||[];
  var s=d.score||0;
  var cls=s>=80?"good":s>=50?"warn":"danger";
  var label=s>=80?"低风险":s>=50?"中等风险":"高风险";
  sr.className="score-row "+cls;
  sr.innerHTML='<div class=score-circle>'+s+'</div><div class=score-info><h3>'+label+'</h3><p>综合评分 &middot; 发现 '+risks.length+' 个风险点 &middot; 缺失 '+d.missing_clauses.length+' 项</p></div>';

  var hi=0,mi=0,lo=0;
  risks.forEach(function(r){
    if(r.risk_level==="high") hi++; else if(r.risk_level==="mid") mi++; else lo++;
  });
  rb.innerHTML='<button class="bar-high active" onclick="filter(\'all\',this)"><span class=n>'+(hi+mi+lo)+'</span>全部</button>'+
    '<button class=bar-high onclick="filter(\'high\',this)"><span class=n>'+hi+'</span>高风险</button>'+
    '<button class=bar-mid onclick="filter(\'mid\',this)"><span class=n>'+mi+'</span>中风险</button>'+
    '<button class=bar-low onclick="filter(\'low\',this)"><span class=n>'+lo+'</span>低风险</button>';
  activeFilter="all";

  renderRisks(risks);
  renderMissing(d.missing_clauses||[]);
  rc.classList.remove("hidden");
  uc.style.display="none";
  window.scrollTo({top:rc.offsetTop-80,behavior:"smooth"});
}

function filter(lv,el){
  activeFilter=lv;
  var btns=rb.querySelectorAll("button");
  btns.forEach(function(b){ b.classList.remove("active") });
  el.classList.add("active");
  var items=lv==="all"?risks:risks.filter(function(r){ return r.risk_level===lv });
  renderRisks(items);
}

function renderRisks(items){
  if(!items.length){ rl.innerHTML='<div class=empty>未发现风险条款</div>'; return }
  var html="";
  items.forEach(function(r,i){
    var lv=r.risk_level==="high"?"lv-high":"lv-mid";
    if(r.risk_level==="low") lv="lv-low";
    var lbl=r.risk_level==="high"?"高风险":r.risk_level==="mid"?"中风险":"低风险";
    var txt=esc(r.found_text||"");
    var sug=esc(r.suggestion||"");
    html+='<div class="risk-item '+lv+'" onclick="this.classList.toggle(\'open\')">'+
      '<div class=rhead><span class=rdot></span><span class=rtitle>'+esc(r.clause_type||"条款")+'</span><span style="font-size:10px;color:#9ca3af">'+lbl+'</span><span class=rarrow>&#9660;</span></div>'+
      '<div class=rbody><div class=rquote>'+txt+'</div><div class=rsug>'+sug+'</div></div></div>';
  });
  rl.innerHTML=html;
}

function renderMissing(items){
  if(!items.length){ mr.innerHTML='<div class=empty>合同条款完整</div>'; return }
  mr.innerHTML=items.map(function(m){ return '<span class=miss-tag>'+esc(m)+'</span>' }).join("");
}

function esc(s){
  var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML;
}

// ── chat ──
cs.onclick=sendChat;
ci.onkeydown=function(e){ if(e.key==="Enter") sendChat() };

async function sendChat(){
  var q=ci.value.trim(); if(!q) return;
  addMsg("you",q,"you");
  ci.value="";
  var loadId=addMsg("bot",'<span class=spin></span> 思考中...',"bot");
  try{
    var fd=new FormData(); fd.append("question",q); fd.append("jurisdiction","cn");
    var r=await fetch("/api/ask",{method:"POST",body:fd});
    if(!r.ok) throw new Error(r.status);
    var d=await r.json();
    var msgs=cb.querySelectorAll(".chat-msg");
    var last=msgs[msgs.length-1];
    if(last) last.remove();
    addMsg("bot",d.answer||"暂无回复","bot");
  }catch(e){
    var msgs2=cb.querySelectorAll(".chat-msg");
    var last2=msgs2[msgs2.length-1];
    if(last2) last2.remove();
    addMsg("bot","抱歉，请求失败: "+e.message,"bot");
  }
}

function addMsg(who,text,cls){
  var label=who==="bot"?'&#12304;ii&#12305;':"你";
  var div=document.createElement("div");
  div.className="chat-msg "+cls;
  div.innerHTML='<div class=who>'+label+'</div>'+text;
  cb.appendChild(div);
  cb.scrollTop=cb.scrollHeight;
  return div;
}

// ── knowledge base ──
ss.oninput=function(){
  var q=ss.value.toLowerCase();
  var items=q?sources.filter(function(s){ return s.heading.toLowerCase().indexOf(q)>-1 || s.file.toLowerCase().indexOf(q)>-1 }):sources;
  renderSrc(items);
};

function renderSrc(items){
  if(!items.length){ sl.innerHTML='<div class=empty>无匹配结果</div>'; return }
  var html="";
  items.forEach(function(s){
    html+='<div class=src-item data-file="'+escAttr(s.file)+'" data-heading="'+escAttr(s.heading)+'">'+esc(s.heading)+'</div>';
  });
  sl.innerHTML=html;
}

// event delegation for source clicks
sl.addEventListener("click",function(e){
  var el=e.target.closest(".src-item"); if(!el) return;
  var f=el.dataset.file, h=el.dataset.heading;
  openSource(f,h);
});

async function openSource(file,heading){
  mt.textContent=heading||file;
  mb.innerHTML='<span class=spin></span> 加载中...';
  mo.classList.add("show");
  try{
    var r=await fetch("/api/source/"+encodeURIComponent(file));
    if(!r.ok) throw new Error(r.status);
    var d=await r.json();
    mb.textContent=d.content||"暂无内容";
  }catch(e){
    mb.textContent="加载失败: "+e.message;
  }
}

function closeModal(){ mo.classList.remove("show") }
mo.addEventListener("click",function(e){ if(e.target===mo) closeModal() });

function escAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

// ── tabs ──
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.onclick=function(){
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active") });
    document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.remove("active") });
    btn.classList.add("active");
    document.getElementById("panel"+(btn.dataset.panel==="risks"?"Risks":"Missing")).classList.add("active");
  };
});

// ── init ──
(async function loadSources(){
  try{
    var r=await fetch("/api/sources");
    var d=await r.json();
    sources=d.sources||[];
    renderSrc(sources);
  }catch(e){
    sl.innerHTML='<div class=empty>知识库加载失败</div>';
  }
})();
</script>
